# Stack de PRODUÇÃO do Quilate (VPS) — integra com um nginx/proxy já existente.
# Os serviços escutam SÓ em 127.0.0.1 (localhost); o nginx do host faz HTTPS e proxy:
#   quilate.<DOMINIO> -> 127.0.0.1:3002   (app Quilate)
#   n8n.<DOMINIO>     -> 127.0.0.1:5678   (N8N)
#   evo.<DOMINIO>     -> 127.0.0.1:8080   (Evolution API)
# Variáveis vêm do arquivo .env (veja .env.prod.example).
# (Para uma VPS limpa sem proxy, existe a variante com Caddy — ver histórico/Caddyfile.)
name: quilate-prod

services:
  quilate:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://quilate:${QUILATE_DB_PASSWORD}@quilate-postgres:5432/quilate
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: https://quilate.${DOMINIO}
      AUTH_TRUST_HOST: "true"
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
      INTEGRACAO_API_TOKEN: ${INTEGRACAO_API_TOKEN}
      UPLOAD_DIR: /app/uploads
      # Transcrição de áudio (Groq Whisper) + download de mídia da Evolution
      GROQ_API_KEY: ${GROQ_API_KEY}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_URL: ${EVOLUTION_URL:-http://evolution-api:8080}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-vps}
    volumes:
      - quilate_uploads:/app/uploads
    depends_on:
      quilate-postgres:
        condition: service_healthy

  quilate-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: quilate
      POSTGRES_PASSWORD: ${QUILATE_DB_PASSWORD}
      POSTGRES_DB: quilate
    volumes:
      - quilate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quilate -d quilate"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      evolution-postgres:
        condition: service_healthy
    environment:
      SERVER_URL: https://evo.${DOMINIO}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: quilate_evolution
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: n8n.${DOMINIO}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://n8n.${DOMINIO}/
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  quilate_uploads:
  quilate_pgdata:
  evolution_pgdata:
  evolution_instances:
  n8n_data:
