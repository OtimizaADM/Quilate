# Stack de integração WhatsApp: Evolution API (+ Postgres/Redis) e N8N.
# Roda separado do banco de dev do Quilate (../docker-compose.yml).
# Local: o Quilate roda no host (porta 3000); os containers alcançam-no por
# host.docker.internal. Na VPS, ajuste QUILATE_BASE_URL para a URL interna.

services:
  evolution-postgres:
    image: postgres:16
    container_name: quilate-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    container_name: quilate-evolution-redis
    restart: unless-stopped
    volumes:
      - evolution_redis:/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: quilate-evolution-api
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      # Persistência no Postgres
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD}@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: quilate_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # Cache local (Redis desligado: o cache de instâncias no Redis costuma
      # travar a geração do QR na Evolution v2; cache local é mais estável p/ pareamento)
      CACHE_REDIS_ENABLED: "false"
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "true"
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: quilate-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      N8N_SECURE_COOKIE: "false" # acesso por http em dev; na VPS use HTTPS atrás de proxy
      # Base do Quilate para as tools do agente (usada nos nós HTTP do N8N)
      QUILATE_BASE_URL: ${QUILATE_BASE_URL:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  evolution_pgdata:
  evolution_redis:
  evolution_instances:
  n8n_data:
